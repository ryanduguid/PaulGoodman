name: Fuzzing

# A 60-second random exploration is not a repeatable merge gate, so it runs
# weekly and on demand rather than on pull requests, and no gate
# requires it. tests/fadden_pii.rs replays the seed corpus in the unit tests.
# cargo-fuzz needs nightly Rust; only this job uses it, and the date is pinned.
on:
  schedule:
    - cron: "59 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzz the privacy patterns
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust and the pinned cargo-fuzz
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-15 --profile minimal
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz
      # The release binary is built for musl and defaults to that target, where
      # the address sanitiser cannot build; both steps fuzz on glibc instead.
      - name: Fuzz the patterns
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu privacy_patterns fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024
      # The other targets grow a scratch copy of their seeds, never the checkout.
      - name: Fuzz the pattern engines, JSON decoder, sort, EPUB reader, inflater and HTML parser
        shell: bash
        run: |
          for target in pattern_engines json_decode python_sort epub_read inflate html_parse; do
            corpus="$RUNNER_TEMP/$target"
            mkdir -p "$corpus"
            cp fuzz/seeds/"$target"/* "$corpus"/
            cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu "$target" "$corpus" -- -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024
          done
