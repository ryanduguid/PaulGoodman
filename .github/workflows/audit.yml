name: Dependency audit

# Pull requests and pushes deny vulnerable, unsound and yanked crates in the
# rust job of ci.yml. This weekly run also denies the remaining warnings, so an
# unmaintained crate turns only this run red rather than blocking a merge.
on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit every Cargo.lock, warnings denied
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --deny warnings && cargo audit --deny warnings --file fuzz/Cargo.lock
