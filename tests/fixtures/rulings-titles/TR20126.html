<META NAME="DC.Title" CONTENT="TR 2012/6 - Income tax: deductibility under subsection 295-465(1) of the Income Tax Assessment Act 1997 of premiums paid by a complying superannuation fund for an insurance policy providing total and permanent disability cover in respect of its members Relying on this Ruling This publication (excluding appendix) is a public ruling for the purposes of the Taxation Administration Act 1953. If this Ruling applies to you, and you correctly rely on it, we will apply the law to you in the way set out in this Ruling. That is, you will not pay any more tax or penalties or interest in respect of the matters covered by this Ruling. (Note: this is a consolidated version of this document. Refer to the ATO Legal database (ato.gov.au/law) to check its currency and to view the details of all changes.) Table of">
